services:

  pyro-debit-service:
    image: debit_service:v2
    container_name: pyro_debit_service
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8010:8010"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"